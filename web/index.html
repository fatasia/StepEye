<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StepEye</title>
  <link rel="icon" type="image/svg+xml" href="/assets/stepeye-icon.svg">
  <link rel="alternate icon" href="/assets/stepeye.ico">
  <link rel="apple-touch-icon" href="/assets/stepeye-180.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/site-shadow.css">
  <link rel="stylesheet" href="/css/patrol.css">
  <link rel="stylesheet" href="/css/command-center.css">
  <link rel="stylesheet" href="/css/trace-report.css">
  <link rel="stylesheet" href="/css/labeling.css">
  <link rel="stylesheet" href="/css/models.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/ai-services.css">
  <link rel="stylesheet" href="/css/global-assistant.css">
  <link rel="stylesheet" href="/css/documents.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="打开导航"></button>
      <div class="brand" id="brand"></div>
      <h1 class="page-title" id="page-title"></h1>
      <div class="topbar-right">
        <span class="conn" id="conn" role="status" aria-live="polite"></span>
        <time class="clock num" id="clock"></time>
        <button class="icon-btn" id="theme-btn"></button>
        <div class="menu-anchor">
          <button class="icon-btn" id="accent-btn" aria-label="主题色" title="主题色" aria-haspopup="true" aria-expanded="false"></button>
          <div class="menu" id="accent-menu" hidden></div>
        </div>
      </div>
    </header>
    <div class="nav-scrim" id="nav-scrim"></div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div id="layer"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
