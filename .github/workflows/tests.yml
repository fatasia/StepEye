name: Native platform checks
on:
  push:
  pull_request:
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: sop-vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sop-vision/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt onnx onnxruntime
      - run: python -m pytest -q
      - run: python -m compileall -q visual tools deploy
      - run: node --test tests-js/store.test.mjs
