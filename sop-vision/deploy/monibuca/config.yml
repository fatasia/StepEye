# Monibuca v6 原生模板：按官网插件文档整理，须用实际 v6 包复核。
# Windows / Linux 共用，不混用 v5 配置。
global:
  loglevel: info
  disableall: true
  http:
    listenaddr: "127.0.0.1:8180"  # StepEye 代理信令，管理端口不对外开放
rtsp:
  enable: true
  tcp:
    listen_addr: ":8554"
webrtc:
  enable: true
  port_range: "udp:9000-9100"
  ice_servers: []
  public_ip: ""
mp4:
  enable: true
  record_path: "./recordings"
  filename_pattern: "{stream}_{date}_{time}.mp4"
  max_duration: 3600
  expire_days: 0
# ONVIF 由 StepEye 接入，GB28181 真机联调后单独启用。
gb28181:
  enable: false
